<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indicadores · Contratação PicPay</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark app-navbar sticky-top">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="bi bi-briefcase-fill"></i> Contrata<span class="text-brand-accent">PicPay</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMain">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Início</a></li>
                <li class="nav-item"><a class="nav-link" href="/candidatos">Candidatos</a></li>
                <li class="nav-item"><a class="nav-link" href="/indicadores">Indicadores</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container my-5">
    <h2 class="page-title mb-4"><i class="bi bi-bar-chart-fill me-2"></i>Indicadores</h2>

    <div class="stat-grid">
        <div class="stat-card stat-total">
            <div class="stat-icon"><i class="bi bi-people-fill"></i></div>
            <div class="stat-value" id="statTotal">3</div>
            <div class="stat-label">Total</div>
        </div>
        <div class="stat-card stat-analise">
            <div class="stat-icon"><i class="bi bi-hourglass-split"></i></div>
            <div class="stat-value" id="statAnalise">1</div>
            <div class="stat-label">Em análise</div>
        </div>
        <div class="stat-card stat-aprovado">
            <div class="stat-icon"><i class="bi bi-check-circle-fill"></i></div>
            <div class="stat-value" id="statAprovado">1</div>
            <div class="stat-label">Aprovados</div>
        </div>
        <div class="stat-card stat-reprovado">
            <div class="stat-icon"><i class="bi bi-x-circle-fill"></i></div>
            <div class="stat-value" id="statReprovado">0</div>
            <div class="stat-label">Reprovados</div>
        </div>
        <div class="stat-card stat-contratado">
            <div class="stat-icon"><i class="bi bi-award-fill"></i></div>
            <div class="stat-value" id="statContratado">1</div>
            <div class="stat-label">Contratados</div>
        </div>
    </div>
</div>

<footer class="app-footer text-center py-4 mt-5">
    <div class="container">
        <small>Sistema de Contratação de Funcionários &middot; Desafio Spring Boot &middot; PicPay</small>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/indicadores.js"></script>
</body>
</html>
